name: Daily News Push

on:
  schedule:
    # 提前到 UTC 0:00 触发（北京8:00），脚本内等到9:00再推送
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Wait until 9:00 AM Beijing time, then push
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          echo "Triggered at 2026-08-11 11:12:30 UTC"
          python main.py --wait-until 9