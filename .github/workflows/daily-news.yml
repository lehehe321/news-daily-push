name: Daily News Push
on:
  schedule:
    # 北京时间 3:50 / 4:20 / 5:05 提前触发 + 8:30 兜底
    # 提前触发点即使遇到 GitHub 排队延迟 2-4 小时，执行时仍在 9 点前，
    # 脚本会精确等待到 09:00 再推送；8:30 兜底处理凌晨任务全部失败的极端情况
    - cron: '50 19 * * *'
    - cron: '20 20 * * *'
    - cron: '5 21 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  push-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Wait until 09:00 Beijing time, then push (daily dedup)
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py --wait-until 09:00 --marker .last_push.txt
          # 若当天已推送过，main.py 会直接退出且不更新标记文件
          git config user.name "news-push-bot"
          git config user.email "news-push-bot@users.noreply.github.com"
          git add .last_push.txt
          if ! git diff --cached --quiet; then
            git commit -m "update daily push marker"
            git push origin main
          fi
